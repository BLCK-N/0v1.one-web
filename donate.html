<body id="donate" class="loading intro-0">

        <img src="images/poclsymbols.gif">
        <img src="images/poclsymbols.gif">

      <h1 id="name"><img src="images/0v1photo.png.png" alt=""></h1>

  <main id="content">
    <section class="donate-panel">
      <h2>donate</h2>
      <p>click an icon to copy the wallet address.</p>
      <div class="wallet-grid">
        <button class="wallet-card" type="button" data-wallet="bc1plw8297ne5hxjs55chvza2fwcj2h47x5ss8nrcc8vp9pkvj37h4wqw2nts8">
          <img src="images/icons8-bitcoin-transparent.png" alt="Bitcoin">
          <span>Bitcoin</span>
        </button>
        <button class="wallet-card" type="button" data-wallet="0xB7A28e253eeB59bB0D9C4aAbc4d8A10f7760b031">
          <img src="images/icons8-ethereum-96.png" alt="Ethereum">
          <span>Ethereum</span>
        </button>
        <button class="wallet-card" type="button" data-wallet="BCym38S8CCMaT58gMagA81EB9NV8wFWBUf3tRMG1a67A">
          <img src="images/icons8-solana-96.png" alt="Solana">
          <span>Solana</span>
        </button>
        <button class="wallet-card" type="button" data-wallet="BCym38S8CCMaT58gMagA81EB9NV8wFWBUf3tRMG1a67A">
          <img src="images/icons8-tether-96.png" alt="Tether USDT">

  </nav>

  <script src="js/pocl.js"></script>
  <script>
    document.querySelectorAll('.wallet-card').forEach(function (card) {
      card.addEventListener('click', async function () {
        const address = card.dataset.wallet;
        const status = document.querySelector('.wallet-status');
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(address);
          } else {
            const helper = document.createElement('textarea');
            helper.value = address;
            helper.setAttribute('readonly', '');
            helper.style.position = 'fixed';
            helper.style.opacity = '0';
            document.body.appendChild(helper);
            helper.select();
            document.execCommand('copy');
            helper.remove();
          }
          status.textContent = 'wallet copied';
        } catch (error) {
          status.textContent = address;
        }
        window.setTimeout(function () { status.textContent = ''; }, 2200);
      });
    });
  </script>
</body>
